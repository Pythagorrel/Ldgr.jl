<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              morning: '#f59e0b',
              afternoon: '#6366f1',
              evening: '#8b5cf6',
              bg: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom dynamic styles & depth utilities */
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .interactive-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .interactive-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px -3px rgba(99, 102, 241, 0.2);
    }

    .input-dynamic {
      transition: all 0.2s ease;
    }
    .input-dynamic:hover {
      border-color: rgba(148, 163, 184, 0.4);
      background-color: rgba(51, 65, 85, 0.5);
    }
    .input-dynamic:focus {
      border-color: #6366f1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
      background-color: rgba(30, 41, 59, 0.9);
      outline: none;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-32">

  <!-- Main Container -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">
    
    <!-- Top Header & Quick Actions -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-amber-400 via-indigo-400 to-violet-400 bg-clip-text text-transparent">
          Timesheet Entry
        </h1>
        <p class="text-slate-400 text-sm mt-1">Chronological 3-zone daily layout with auto-sync</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fillStandardWeek()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition duration-200 shadow-sm hover:shadow">
          ⚡ Auto-Fill Standard 40h
        </button>
        <button onclick="resetForm()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-slate-900 hover:bg-red-950/40 text-red-400 border border-slate-800 hover:border-red-900/50 transition duration-200">
          Reset
        </button>
      </div>
    </header>

    <div class="flex gap-8 items-start">
      
      <!-- STICKY SIDE JUMP MENU -->
      <aside class="hidden lg:block w-56 sticky top-8 space-y-2 glass-panel p-3 rounded-2xl shrink-0 shadow-2xl">
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 py-2 border-b border-slate-800/80 mb-1">
          Quick Jump
        </div>
        <nav id="side-nav" class="space-y-1 text-sm">
          <!-- Populated by JavaScript -->
        </nav>
      </aside>

      <!-- MAIN ENTRY GRID CONTAINER -->
      <main class="flex-1 space-y-8 min-w-0" id="days-container">
        <!-- Day Cards Generated by JS -->
      </main>

    </div>
  </div>

  <!-- FLOATING STICKY BOTTOM DOCK -->
  <div class="fixed bottom-6 left-0 right-0 z-50 px-4 pointer-events-none">
    <div class="max-w-4xl mx-auto glass-panel rounded-2xl p-4 shadow-2xl border border-indigo-500/30 backdrop-blur-xl pointer-events-auto flex flex-wrap items-center justify-between gap-4">
      
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-3">
          <div class="relative w-12 h-12 flex items-center justify-center">
            <svg class="w-12 h-12 transform -rotate-90">
              <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" class="text-slate-800" fill="transparent" />
              <circle id="progress-circle" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="4" class="text-indigo-500 transition-all duration-500" stroke-dasharray="125.6" stroke-dashoffset="125.6" fill="transparent" />
            </svg>
            <span id="target-percentage" class="absolute text-[10px] font-bold">0%</span>
          </div>
          <div>
            <div class="text-xs text-slate-400 font-medium">Weekly Total</div>
            <div class="text-2xl font-black text-white tracking-tight"><span id="weekly-total">0.0</span> <span class="text-xs font-normal text-slate-400">/ 40.0 hrs</span></div>
          </div>
        </div>

        <div class="hidden sm:flex items-center gap-4 border-l border-slate-800 pl-6">
          <div>
            <div class="text-[10px] text-amber-400/80 uppercase font-semibold">Morning</div>
            <div class="text-sm font-bold text-slate-200" id="total-morning">0.0h</div>
          </div>
          <div>
            <div class="text-[10px] text-indigo-400/80 uppercase font-semibold">Afternoon</div>
            <div class="text-sm font-bold text-slate-200" id="total-afternoon">0.0h</div>
          </div>
          <div>
            <div class="text-[10px] text-violet-400/80 uppercase font-semibold">Evening</div>
            <div class="text-sm font-bold text-slate-200" id="total-evening">0.0h</div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition duration-200 transform hover:scale-[1.02] active:scale-[0.98]">
          Submit Timesheet
        </button>
      </div>

    </div>
  </div>

  <script>
    const days = [
      { id: 'mon', name: 'Monday', date: 'Oct 12' },
      { id: 'tue', name: 'Tuesday', date: 'Oct 13' },
      { id: 'wed', name: 'Wednesday', date: 'Oct 14' },
      { id: 'thu', name: 'Thursday', date: 'Oct 15' },
      { id: 'fri', name: 'Friday', date: 'Oct 16' }
    ];

    const stages = [
      { key: 'morning', label: 'Morning Zone', range: '08:00 - 12:00', barColor: 'bg-gradient-to-r from-amber-500 to-amber-400', badgeClass: 'text-amber-400 bg-amber-500/10 border-amber-500/20' },
      { key: 'afternoon', label: 'Afternoon Zone', range: '12:00 - 16:00', barColor: 'bg-gradient-to-r from-indigo-500 to-indigo-400', badgeClass: 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20' },
      { key: 'evening', label: 'Evening Zone', range: '16:00 - 20:00+', barColor: 'bg-gradient-to-r from-violet-500 to-violet-400', badgeClass: 'text-violet-400 bg-violet-500/10 border-violet-500/20' }
    ];

    // Build DOM Elements
    function initUI() {
      const container = document.getElementById('days-container');
      const sideNav = document.getElementById('side-nav');

      days.forEach((day, dayIdx) => {
        // Build Side Nav Anchor Links
        const navItem = document.createElement('a');
        navItem.href = `#${day.id}`;
        navItem.className = `side-link flex items-center justify-between px-3 py-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition duration-150`;
        navItem.innerHTML = `
          <span class="font-medium">${day.name}</span>
          <span class="text-xs font-mono text-slate-500" id="nav-total-${day.id}">0.0h</span>
        `;
        sideNav.appendChild(navItem);

        // Build Day Card
        const card = document.createElement('section');
        card.id = day.id;
        card.className = `glass-panel rounded-2xl p-6 relative overflow-hidden interactive-card border border-slate-800/80`;
        
        let stagesHTML = '';
        stages.forEach((stage) => {
          const tabIndex = (dayIdx * 3) + (stage.key === 'morning' ? 1 : stage.key === 'afternoon' ? 2 : 3);
          stagesHTML += `
            <div class="flex-1 bg-slate-900/60 rounded-xl p-4 border border-slate-800 relative group/stage hover:border-slate-700/80 transition duration-200">
              <!-- Thicker Accent Bar (6px) -->
              <div class="h-1.5 w-full ${stage.barColor} rounded-full mb-3"></div>
              
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold uppercase tracking-wider px-2 py-0.5 rounded-md border ${stage.badgeClass}">
                  ${stage.label}
                </span>
                <span class="text-[11px] text-slate-500 font-mono">${stage.range}</span>
              </div>

              <div class="space-y-3">
                <div>
                  <label class="block text-[11px] font-medium text-slate-400 mb-1">Hours Spent</label>
                  <input 
                    type="number" 
                    min="0" 
                    max="12" 
                    step="0.5" 
                    placeholder="0.0"
                    tabindex="${tabIndex}"
                    data-day="${day.id}" 
                    data-stage="${stage.key}"
                    oninput="calculateTotals()"
                    class="input-dynamic w-full bg-slate-800/80 border border-slate-700/70 rounded-lg px-3 py-2 text-white font-mono text-sm focus:outline-none placeholder-slate-600"
                  />
                </div>
                <div>
                  <label class="block text-[11px] font-medium text-slate-400 mb-1">Activity / Focus</label>
                  <input 
                    type="text" 
                    placeholder="Key tasks worked on..."
                    class="input-dynamic w-full bg-slate-800/50 border border-slate-700/50 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none placeholder-slate-600"
                  />
                </div>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="flex items-center justify-between pb-4 mb-5 border-b border-slate-800">
            <div class="flex items-center gap-3">
              <h2 class="text-xl font-bold text-slate-100">${day.name}</h2>
              <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded-md text-slate-400">${day.date}</span>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="copyPreviousDay('${day.id}')" class="text-xs text-slate-400 hover:text-indigo-400 transition flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copy Prev
              </button>
              <div class="text-sm font-semibold text-slate-300">
                Day Total: <span id="day-total-${day.id}" class="text-indigo-400 font-mono font-bold">0.0</span> <span class="text-xs text-slate-500">hrs</span>
              </div>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${stagesHTML}
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Dynamic Calculations & Gauge Updates
    function calculateTotals() {
      let grandTotal = 0;
      let stageTotals = { morning: 0, afternoon: 0, evening: 0 };

      days.forEach(day => {
        let daySum = 0;
        stages.forEach(stage => {
          const input = document.querySelector(`input[data-day="${day.id}"][data-stage="${stage.key}"]`);
          const val = parseFloat(input.value) || 0;
          daySum += val;
          stageTotals[stage.key] += val;
        });
        
        document.getElementById(`day-total-${day.id}`).innerText = daySum.toFixed(1);
        document.getElementById(`nav-total-${day.id}`).innerText = `${daySum.toFixed(1)}h`;
        grandTotal += daySum;
      });

      // Update UI displays
      document.getElementById('weekly-total').innerText = grandTotal.toFixed(1);
      document.getElementById('total-morning').innerText = `${stageTotals.morning.toFixed(1)}h`;
      document.getElementById('total-afternoon').innerText = `${stageTotals.afternoon.toFixed(1)}h`;
      document.getElementById('total-evening').innerText = `${stageTotals.evening.toFixed(1)}h`;

      // Update Radial Progress (Target: 40 hours)
      const target = 40.0;
      const percentage = Math.min(Math.round((grandTotal / target) * 100), 100);
      document.getElementById('target-percentage').innerText = `${percentage}%`;

      const circle = document.getElementById('progress-circle');
      const circumference = 2 * Math.PI * 20; // r=20
      const offset = circumference - (percentage / 100) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    // Helper: Quick Fill Demo
    function fillStandardWeek() {
      days.forEach(day => {
        const mInput = document.querySelector(`input[data-day="${day.id}"][data-stage="morning"]`);
        const aInput = document.querySelector(`input[data-day="${day.id}"][data-stage="afternoon"]`);
        const eInput = document.querySelector(`input[data-day="${day.id}"][data-stage="evening"]`);
        
        if (mInput) mInput.value = 4.0;
        if (aInput) aInput.value = 4.0;
        if (eInput) eInput.value = 0.0;
      });
      calculateTotals();
    }

    // Helper: Reset All Inputs
    function resetForm() {
      document.querySelectorAll('input[type="number"], input[type="text"]').forEach(i => i.value = '');
      calculateTotals();
    }

    // Helper: Copy Previous Day
    function copyPreviousDay(currentDayId) {
      const idx = days.findIndex(d => d.id === currentDayId);
      if (idx <= 0) return; // Mon has no previous day
      
      const prevDayId = days[idx - 1].id;
      stages.forEach(stage => {
        const prevInput = document.querySelector(`input[data-day="${prevDayId}"][data-stage="${stage.key}"]`);
        const currInput = document.querySelector(`input[data-day="${currentDayId}"][data-stage="${stage.key}"]`);
        if (prevInput && currInput) {
          currInput.value = prevInput.value;
        }
      });
      calculateTotals();
    }

    // ScrollSpy for Side Jump Menu
    window.addEventListener('scroll', () => {
      let current = '';
      days.forEach(day => {
        const section = document.getElementById(day.id);
        const sectionTop = section.offsetTop;
        if (pageYOffset >= sectionTop - 120) {
          current = day.id;
        }
      });

      document.querySelectorAll('.side-link').forEach(link => {
        link.classList.remove('bg-indigo-600/20', 'text-indigo-400', 'border', 'border-indigo-500/30');
        if (link.getAttribute('href') === `#${current}`) {
          link.classList.add('bg-indigo-600/20', 'text-indigo-400', 'border', 'border-indigo-500/30');
        }
      });
    });

    // Initialize layout
    initUI();
    calculateTotals();
  </script>
</body>
</html>
